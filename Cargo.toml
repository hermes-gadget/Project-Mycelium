[package]
name = "mycelium"
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace]
members = [
    "core",
    "core/bridge",
    "core/radio_bus",
    "core/display",
    "core/input",
    "core/storage",
    "core/gps",
    "core/board",
]
resolver = "2"

[[bin]]
name = "mycelium"
path = "core/src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
libloading = "0.8"
sdl2 = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
