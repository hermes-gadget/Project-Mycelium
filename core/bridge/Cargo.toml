[package]
name = "meshemu_bridge"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
libc = "0.2"
libloading = "0.8"
mycelium-board = { path = "../board" }
mycelium-display = { path = "../display" }
mycelium-gps = { path = "../gps" }
mycelium-input = { path = "../input" }
mycelium-storage = { path = "../storage" }
radio_bus = { path = "../radio_bus" }
sdl2 = { version = "0.38", features = ["bundled"] }
tracing = "0.1"
